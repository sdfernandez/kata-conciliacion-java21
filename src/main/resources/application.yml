spring:
  application:
    name: conciliacion
  datasource:
    url: jdbc:postgresql://localhost:5432/conciliacion
    username: conciliacion
    password: conciliacion
  jpa:
    # El esquema lo maneja Flyway. Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    # Evita mantener la sesión abierta durante el render de la respuesta HTTP (esconde N+1).
    open-in-view: false
    properties:
      hibernate:
        # Agrupa los INSERT/UPDATE en lotes de 50 (un viaje a la base en vez de 50).
        # Solo funciona porque los IDs salen de una SEQUENCE (con IDENTITY se desactiva).
        jdbc.batch_size: 50
        # Ordena los INSERT por entidad para que no se corte el lote al alternar tablas.
        order_inserts: true
        order_updates: true

conciliacion:
  partitions:
    # Retención de resultados online. Lo más viejo se archiva y se borra por partición entera.
    retention-months: 24
    # Particiones creadas por adelantado (sin DEFAULT: un mes sin partición hace fallar el INSERT).
    months-ahead: 3
    cron: "0 0 3 * * *"

  outbox:
    poll-interval-ms: 1000
    batch-size: 100
    # Después de N intentos fallidos el evento sale de la cola (dead letter) y hay que alertar.
    max-attempts: 10

  processor-api:
    base-url: http://localhost:8089
    connect-timeout: 2s
    # p99 de la descarga (~3 s) + margen. Presupuesto: 4 intentos × 10 s + backoffs ≈ 42 s,
    # muy por debajo de la ventana del job nocturno.
    request-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
